# TLS termination for the Discord interactions endpoint.
#
# nginx rather than anything of its own, because the host already runs nginx with
# certbot for other sites. A second web server would fight it for :80 and :443 and
# take those sites down, and a second ACME client would fight it for the challenge —
# so this reuses both, and renewal is already someone else's solved problem.
#
# HTTP only, deliberately. `listen 443 ssl` without an ssl_certificate makes
# `nginx -t` fail outright, so shipping the TLS block would break the reload that
# certbot needs to bootstrap — and take the host's other sites down with it.
#
# Install, in this order:
#   sudo cp nginx-webhooks.conf /etc/nginx/sites-available/webhooks.session.codes
#   sudo ln -s /etc/nginx/sites-available/webhooks.session.codes /etc/nginx/sites-enabled/
#   sudo nginx -t                                     # validate; do not reload yet
#   sudo certbot --nginx --redirect -d webhooks.session.codes
#   sudo nginx -t && sudo systemctl reload nginx      # validate what certbot wrote
#
# Point DNS at the box before the certbot step or it has nothing to validate against.
#
# What certbot does to this file, and why the shape below suits it:
#
#   * It edits this server block **in place** rather than duplicating it, adding
#     `listen 443 ssl` and the ssl_certificate directives here. So everything below —
#     the body cap, the HSTS header, both locations, the catch-all 404 — ends up
#     serving HTTPS with nothing moved by hand. That in-place edit is also why a
#     pre-existing `listen 443` breaks it: you get `duplicate listen options`.
#   * `--redirect` is passed explicitly, not left to the prompt. Without it, whether
#     this block keeps `listen 80` alongside 443 varies, and an unencrypted POST to
#     /discord/interactions would be proxied. Discord only ever calls over HTTPS so
#     it should never arise, but there is no reason to leave the door open. With it,
#     certbot inserts a separate :80 server that 301s and 404s everything else.
#
# Until that runs, this block proxies /discord/interactions over plain HTTP. That
# window is deliberate and bounded: certbot reloads nginx itself to answer the
# challenge, so it lasts seconds, and nothing can be actioned through the endpoint
# without a signature only Discord can produce — the URL is not given to Discord
# until after TLS is up. Guarding the path with a 404 here would be worse: certbot
# edits this block in place, so the guard would persist into the HTTPS server and
# silently 404 production unless somebody remembered to remove it.
#
# After certbot runs, this file on disk no longer matches the copy in git. Re-copying
# it would discard the certificate directives — so edit it in place from then on, or
# re-run certbot after copying.

server {
    listen 80;
    listen [::]:80;
    server_name webhooks.session.codes;

    # Interaction bodies are small; anything larger is not from Discord. This is a
    # public endpoint, so the cap matters — nothing downstream limits a body, and the
    # relay has to read the whole thing to verify its signature.
    client_max_body_size 256k;

    server_tokens off;


    # The relay logs ticket ids and outcomes and never content. An access log here
    # would add only a record of who pressed a button, so it stays off — matching
    # uvicorn's --no-access-log in zendesk-relay.service.
    access_log off;

    # Discord is the only thing that needs to reach this, and it only ever POSTs to
    # one path. The path is vendor-namespaced so this host and certificate can carry
    # other integrations later without a second of either.
    location = /discord/interactions {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nothing here may alter the body: the Ed25519 signature covers the raw
        # bytes, so any rewriting would turn every request into a 401.
        #
        # Short, because Discord gives up at 3 seconds anyway — a hung relay should
        # free the connection rather than hold it for the default minute.
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Zendesk's turn: a `claude:` private note on a ticket. Same shape as above and
    # for the same reasons — exact path, nothing that touches the body, since the
    # HMAC signature covers the raw bytes too.
    location = /zendesk/notes {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The relay answers straight away and does the work in the background, so
        # this waits on an acknowledgement rather than on Claude.
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Everything else gets a 404 rather than a hint that more exists.
    location / {
        return 404;
    }
}
