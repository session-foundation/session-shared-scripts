name: Zendesk Ticket Triage

# Weekdays over a 72h window, wider than the day between runs so a failed run doesn't
# drop a day and Monday reaches back past the weekend. The overlap doesn't duplicate
# Discord posts: a dedup state file skips tickets whose updated_at hasn't moved.
#
# That state lives in the Actions cache, which is best-effort — see the README. Missing
# state degrades to re-reporting the window once: noisy, never wrong.
on:
  schedule:
    # 00:00 UTC = 10:00 AEST / 11:00 AEDT, so the digest opens the Australian workday.
    # Cron is UTC-only: pinned to UTC+10 rather than UTC+11 ("0 23 * * 0-4") because that
    # keeps the cron's day-of-week aligned with the local one.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      query:
        description: "Zendesk search query (overrides the rolling window entirely)"
        required: false
      window_hours:
        description: "Analyze tickets updated in the last N hours (default 72)"
        required: false
      max_tickets:
        description: "Max tickets to analyze (default 1000, Zendesk's search cap)"
        required: false
      reset_state:
        description: "Ignore saved state and re-report everything in the window"
        type: boolean
        default: false
      no_discord:
        description: "Analyze but post nothing (records nothing either, so the next run still reports these tickets)"
        type: boolean
        default: false

# Two overlapping runs would race on the state file and the loser's reported tickets
# would be forgotten. Queue rather than cancel, so a manual run never discards a write.
concurrency:
  group: zendesk-triage
  cancel-in-progress: false

# Everything it writes goes to Zendesk/Discord over their own credentials.
permissions:
  contents: read

jobs:
  # Before the digest, never after: a solved review leaves the triage's `status<solved`
  # query, so running first is what stops the digest re-counting reviews just closed.
  # Skipped on a manual dispatch — this button triages, it must not bulk-edit Zendesk.
  resolve:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/zendesk_resolve_reviews.yml
    with:
      apply: true
    secrets: inherit

  # always(): resolve is an optimisation for the digest, not a precondition, and it also
  # covers the dispatch case above where resolve is skipped. A failed resolve still turns
  # the run red, and notify_failure.yml watches this workflow by name.
  triage:
    needs: resolve
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r zendesk_triage/requirements.txt

      # Unique key per run; restore-keys pulls in the most recent previous one.
      # run_attempt is in the key because cache entries are immutable — a re-run reuses
      # run_id, so attempt 2's save would collide with attempt 1's and write nothing.
      # Restore and save are split so the save can be if: always(): the script records
      # partially-delivered tickets even when a later Discord POST fails.
      - name: Restore triage state
        uses: actions/cache/restore@v6
        with:
          path: .triage-state
          key: zendesk-triage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zendesk-triage-state-

      # Inputs arrive via env, never interpolated straight into a shell command,
      # and both outputs are stripped to digits so the run step below is safe.
      - name: Resolve window and cap
        id: cfg
        env:
          INPUT_WINDOW: ${{ github.event.inputs.window_hours }}
          INPUT_MAX: ${{ github.event.inputs.max_tickets }}
          RESET_STATE: ${{ github.event.inputs.reset_state }}
          NO_DISCORD: ${{ github.event.inputs.no_discord }}
        run: |
          # The cap is a runaway guard, not a batch size: a 72h window is ~70
          # tickets, and anything over --batch-size is split across requests
          # rather than truncated. 1000 is Zendesk's own search result limit —
          # asking for more just walks pagination into a 422, so don't.
          window=$(printf '%s' "${INPUT_WINDOW:-72}" | tr -cd '0-9')
          max=$(printf '%s' "${INPUT_MAX:-1000}" | tr -cd '0-9')
          : "${window:=72}"
          : "${max:=1000}"
          # --no-discord, not --dry-run: this log is public, and a dry run would
          # print the digest — ticket content and all — straight into it.
          flags=""
          if [ "$NO_DISCORD" = "true" ]; then flags="--no-discord"; fi
          echo "window=$window" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          if [ "$RESET_STATE" = "true" ]; then
            rm -f .triage-state/seen.json
            echo "State reset: every ticket in the window will be re-reported."
          fi
          if [ "$NO_DISCORD" = "true" ]; then
            echo "Discord disabled: nothing will be posted, and nothing recorded, so the next run still reports these tickets."
          fi
          echo "Window: ${window}h, max tickets: ${max}"

      - name: Run triage
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZENDESK_DISCORD_WEBHOOK_URL: ${{ secrets.ZENDESK_DISCORD_WEBHOOK_URL }}
          ZENDESK_QUERY: ${{ github.event.inputs.query }}
          ZENDESK_TRIAGE_MODEL: ${{ vars.ZENDESK_TRIAGE_MODEL }}
        run: |
          mkdir -p .triage-state
          python zendesk_triage/triage.py \
            ${{ steps.cfg.outputs.flags }} \
            --window-hours "${{ steps.cfg.outputs.window }}" \
            --max-tickets "${{ steps.cfg.outputs.max }}" \
            --state .triage-state/seen.json

      # always(): the script writes state for tickets Discord accepted even when a
      # later message fails, and that must survive the job's non-zero exit.
      - name: Save triage state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .triage-state
          key: zendesk-triage-state-${{ github.run_id }}-${{ github.run_attempt }}
