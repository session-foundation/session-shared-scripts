name: Zendesk Resolve Positive Reviews

# Solves the 4-5★ AppFollow reviews that were never going to be actioned, so the unsolved
# backlog reflects real work. No state file: a solved ticket drops out of the query, so
# runs are idempotent.
#
# ⚠️  This workflow writes to Zendesk. A chained run from zendesk_triage.yml always
#     applies; a manual run is a dry run unless you tick `apply`. Solving a ticket can
#     fire triggers and automations (satisfaction surveys among them), so read the warning
#     in zendesk_triage/resolve_reviews.py before the first applied run.
on:
  # No cron of its own: it runs as zendesk_triage.yml's first job, because a solved review
  # leaves the triage's `status<solved` query and so must go before the digest is built.
  workflow_call:
    inputs:
      apply:
        description: "Actually solve the tickets (false = dry run, changes nothing)"
        type: boolean
        default: false
      max_tickets:
        description: "Max tickets to solve this run (default 1000, Zendesk's search cap)"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually solve the tickets (unticked = dry run, changes nothing)"
        type: boolean
        default: false
      max_tickets:
        description: "Max tickets to solve this run (default 1000, Zendesk's search cap)"
        required: false

# Bulk jobs are asynchronous, so a second run would re-fetch tickets the first has already
# queued. Queue rather than cancel, so a manual run never abandons in-flight batches.
concurrency:
  group: zendesk-resolve-reviews
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      # First, ahead of the checkout: the failure reporter keys off its `apply` output, so
      # anything running earlier would fail unreported. Inputs arrive via env and are
      # stripped to digits, never interpolated into the command.
      #
      # `inputs`, not `github.event.inputs`: inside a called workflow the `github` context
      # is the caller's, so that would read zendesk_triage.yml's dispatch form instead.
      - name: Resolve options
        id: cfg
        env:
          INPUT_MAX: ${{ inputs.max_tickets }}
          APPLY: ${{ inputs.apply }}
        run: |
          max=$(printf '%s' "${INPUT_MAX:-1000}" | tr -cd '0-9')
          : "${max:=1000}"
          flags=""
          if [ "$APPLY" = "true" ]; then flags="--apply"; fi
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          if [ "$APPLY" = "true" ]; then
            echo "Applying: up to $max review(s) at 4★ or better will be solved."
          else
            echo "Dry run: reporting only, nothing will be changed."
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r zendesk_triage/requirements.txt

      - name: Resolve positive reviews
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          # The triage channel's webhook, the one the digest posts to, not the shared
          # DISCORD_WEBHOOK_URL the failure notifier uses.
          ZENDESK_DISCORD_WEBHOOK_URL: ${{ secrets.ZENDESK_DISCORD_WEBHOOK_URL }}
        run: |
          python zendesk_triage/resolve_reviews.py \
            ${{ steps.cfg.outputs.flags }} \
            --max-tickets "${{ steps.cfg.outputs.max }}"

      # The script reports what it solved, or that there was nothing to solve. It cannot
      # report the failures that kill it before a message exists, and silence in the
      # channel reads the same as a quiet day. Says nothing about counts, because it also
      # fires after the script has already posted a tally alongside per-ticket failures.
      - name: Report a failed run
        if: failure() && steps.cfg.outputs.apply == 'true'
        env:
          WEBHOOK: ${{ secrets.ZENDESK_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A missing webhook is itself one of the things that fails the run, so name it
          # rather than letting curl report an empty URL over the top of the real cause.
          if [ -z "$WEBHOOK" ]; then
            echo "ZENDESK_DISCORD_WEBHOOK_URL is not set; the failure went unreported."
            exit 1
          fi
          message=$(jq -nc --arg url "$RUN_URL" '{content: (
            "❌ Resolving positive reviews failed — [run log](" + $url + "). "
            + "Any tickets already solved stayed solved; the next run picks up the rest."
          )}')
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
            -d "$message" "$WEBHOOK"
